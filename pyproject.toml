[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cot-eval"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Gregor Betz", email = "3662782+ggbetz@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "hf_transfer",
    "huggingface_hub==0.26.2",
    "requests==2.32.3",
    "SQLAlchemy==2.0.36",
    "aiohappyeyeballs==2.4.3",
    "aiohttp==3.10.10",
    "aiosignal==1.3.1",
    "annotated-types==0.7.0",
    "anyio==4.6.2.post1",
    "attrs==24.2.0",
    "datasets==3.1.0",
    "dill==0.3.8",
    "distro==1.9.0",
    "faker==30.8.2",
    "frozenlist==1.5.0",
    "fsspec==2024.9.0",
    "greenlet==3.1.1",
    "h11==0.14.0",
    "httpcore==1.0.6",
    "httpx==0.27.2",
    "jiter==0.7.0",
    "jsonpatch==1.33",
    "jsonpointer==3.0.0",
    "langchain==0.3.6",
    "langchain-core==0.3.15",
    "langchain-openai==0.2.5",
    "langchain-text-splitters==0.3.1",
    "langsmith==0.1.139",
    "multidict==6.1.0",
    "multiprocess==0.70.16",
    "numpy==1.26.4",
    "openai==1.53.0",
    "orjson==3.10.10",
    "pandas==2.2.3",
    "propcache==0.2.0",
    "pyarrow==18.0.0",
    "pydantic==2.9.2",
    "pydantic-core==2.23.4",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.0.1",
    "pytz==2024.2",
    "pyyaml",
    "requests-toolbelt==1.0.0",
    "six==1.16.0",
    "sniffio==1.3.1",
    "tenacity==9.0.0",
    "tiktoken==0.8.0",
    "tzdata==2024.2",
    "xxhash==3.5.0",
    "yarl==1.17.1",
  ]

# required to include yaml files in pip installation
[tool.setuptools.package-data]
lm_eval = ["**/*.yaml", "configs/**/*"]

[project.optional-dependencies]
cuda = [
  "vllm",
]

[project.scripts]
cot-eval = "cot_eval.__main__:main"

[project.urls]
Documentation = "https://github.com/unknown/cot-eval#readme"
Issues = "https://github.com/unknown/cot-eval/issues"
Source = "https://github.com/unknown/cot-eval"

[tool.hatch.version]
path = "src/cot_eval/__about__.py"

[tool.hatch.envs.default]
dependencies = [
  "coverage[toml]>=6.5",
  "click",
  "colorama",
  "pyyaml",
  "pytest",
  "types-PyYAML",
]
[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = [
  "- coverage combine",
  "coverage report",
]
cov = [
  "test-cov",
  "cov-report",
]

[[tool.hatch.envs.all.matrix]]
python = ["3.8", "3.9", "3.10", "3.11", "3.12"]

[tool.hatch.envs.cuda]
dependencies = [
  "vllm",
]

[tool.hatch.envs.types]
dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/cot_eval tests}"

[tool.coverage.run]
source_pkgs = ["cot_eval", "tests"]
branch = true
parallel = true
omit = [
  "src/cot_eval/__about__.py",
]

[tool.coverage.paths]
cot_eval = ["src/cot_eval", "*/cot-eval/src/cot_eval"]
tests = ["tests", "*/cot-eval/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
